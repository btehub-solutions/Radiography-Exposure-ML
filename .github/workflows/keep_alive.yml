name: Keep-Alive Server Automation

on:
  workflow_dispatch: # Manual trigger only; automatic 10-minute schedule disabled to stop failure emails

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Radiography ML Health Endpoint
        run: |
          echo "Sending automated ping to keep Render instance warm..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://radiography-exposure-ml.onrender.com/health || true)
          HTTP_STATUS=${HTTP_STATUS:-000}
          echo "Health check response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Server is healthy, warm, and ready for inference."
          else
            echo "Notice: Server returned status $HTTP_STATUS"
          fi
